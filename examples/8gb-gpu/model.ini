; Worked example: five role-based presets for a consumer GPU with 8 GB of VRAM and 32 GB of RAM.
; Copy to llamacpp/model.ini. Model repos are public Hugging Face GGUF repositories; nothing here is machine-specific
; except `threads` (physical cores) and the n-cpu-moe value, which you re-derive with scripts/benchmark.ps1.

[*]
ctx-size = 32768
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
reasoning-format = deepseek
threads = 12

[Deep]
; Qwen3.5-35B-A3B MoE: attention + KV on GPU, experts in RAM. Hard reasoning, planning, hard coding.
hf = unsloth/Qwen3.5-35B-A3B-GGUF:UD-IQ4_XS
; n-cpu-moe sweep with llama-bench (tg128) on this 8 GB card: 24 -> out of memory, 27 -> 40.7 t/s, 30 -> 40.7, 33 -> 39.3, 36 -> 37.9, 40 -> 33.8.
; 30 keeps ~40 t/s and leaves ~1 GB of VRAM headroom at 32k context (7.1 GB used).
n-cpu-moe = 30
reasoning = on
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0

[Dev]
; Qwen3.5-9B dense, fully on GPU. Coding agent default (Pi). Thinking off for agent loops; use Deep for planning.
hf = unsloth/Qwen3.5-9B-GGUF:UD-Q4_K_XL
reasoning = off
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0

[Quick]
; Everyday chat, summaries, translation. gemma-4-26B-A4B MoE (30 layers), experts in RAM, attention + KV on the GPU.
; n-cpu-moe sweep with llama-bench (tg128) on this 8 GB card: 16 -> 27.6 t/s (spills into shared memory), 18 -> 40.7,
; 20 -> 38.8, 22 -> 33.6, 26 -> 31.0, 30 -> 28.3. 20 leaves headroom for the 32k context (7.5 GB used).
; (Earlier picks here, judged lower on the everyday suite: gemma-4-E4B-it Q5_K_M, then the Dev file Qwen3.5-9B.)
hf = unsloth/gemma-4-26B-A4B-it-GGUF:UD-IQ4_XS
n-cpu-moe = 20
reasoning = off
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0

[Muse]
; Creative writing and brainstorming: same file and offload as Quick. (Hermes-3-Llama-3.1-8B was the first pick; judged lower.)
hf = unsloth/gemma-4-26B-A4B-it-GGUF:UD-IQ4_XS
n-cpu-moe = 20
reasoning = off
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0

[Sentinel]
; Foundation-Sec-8B-Instruct (Cisco Foundation AI), defensive security / threat intel.
hf = mradermacher/Foundation-Sec-8B-Instruct-GGUF:Q5_K_M
temp = 0.3
top-p = 0.9
